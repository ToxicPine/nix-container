pid /tmp/benchmark-nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 8080;

        location = /1m {
            default_type application/octet-stream;
            alias @BENCHMARK_1M@;
        }

        location / {
            default_type text/plain;
            return 200 "fast-vms nginx benchmark\n";
        }
    }
}
